<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>MonStage — Prototype MVP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f8f5;--card:#fff;--tx:#0f172a;--mut:#56645e;--bd:#dfe9e3;--ac:#0f8a5f;--btn:#0f7a55;--ok:#12805c;--okbg:#e3f6ee;--warn:#8a6414;--warnbg:#fbf1da;--nav:#0c2a20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1612;--card:#12241d;--tx:#e8f2ed;--mut:#9bb3a9;--bd:#1f3a2f;--ac:#4cd6a0;--btn:#0f7a55;--ok:#5fd3a6;--okbg:#10382c;--warn:#e8c070;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#0a1612;--card:#12241d;--tx:#e8f2ed;--mut:#9bb3a9;--bd:#1f3a2f;--ac:#4cd6a0;--btn:#0f7a55;--ok:#5fd3a6;--okbg:#10382c;--warn:#e8c070;--warnbg:#3a2f12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--nav);color:#c9d1e6;padding:20px 14px;flex:none;display:flex;flex-direction:column;gap:4px}
nav b{font-size:20px;color:#fff;margin:0 8px 2px}nav b i{font-style:normal;color:#4cd6a0}nav small{margin:0 8px 16px;color:#8590aa;font-size:12px}
nav a{color:inherit;text-decoration:none;padding:9px 10px;border-radius:8px;border-left:3px solid transparent}
nav a:hover,nav a.on{background:#123a2d;color:#fff}nav a.on{border-left-color:#4cd6a0}nav .sp{flex:1}
main{flex:1;padding:28px;max-width:900px;min-width:0}
main a:not(.btn){color:var(--ac)}h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}.mut{color:var(--mut)}.sm{font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin:14px 0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar>div{height:100%;background:var(--ac)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button,.btn{font:inherit;background:var(--btn);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0 12px}
input[type=checkbox],input[type=radio]{width:auto;margin:0 8px 0 0}label{display:block;font-size:14px}
.chip{font:12px ui-monospace,Menlo,Consolas,monospace;padding:2px 8px;border-radius:10px;background:var(--bd);color:var(--mut)}
.chip.completee{background:var(--okbg);color:var(--ok)}.chip.active{background:var(--btn);color:#fff}
.wk{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.wk:first-of-type{border-top:0}.wk code{width:34px;color:var(--mut)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.cert{border:2px solid var(--ac);background:var(--card);border-radius:12px;padding:26px;text-align:center}.cert h2{font-size:24px}
.code{font:12px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px}
.err{color:#c0392b;font-size:14px;min-height:20px}.note{background:var(--warnbg);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.lk{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
@media (max-width:720px){body{flex-direction:column}nav{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}nav small{display:none}nav .sp{display:none}main{padding:16px}}
@media print{nav,.noprint{display:none}body{display:block}}
</style></head><body>
<nav id="nav" aria-label="Navigation principale"></nav><main id="app" tabindex="-1"></main>
<script>
/*ENGINE*/
const TASKS=[{"n":1,"titre":"Inventaire et classification des actifs","comp":"Gestion des actifs (NIST CSF : Identifier)","h":3,"ctx":"Vous êtes analyste junior à la Clinique Boréale, une clinique de physiothérapie fictive de 25 employés sur 2 sites. Aucun inventaire informatique n’existe. Parc connu : 18 postes Windows, 2 serveurs (dossiers patients et courriel), 1 NAS de sauvegarde, 1 routeur/pare-feu, un système de rendez-vous infonuagique, 6 tablettes et des imprimantes réseau.","mission":"Dressez un registre d’au moins 10 actifs. Pour chacun : nom, type, propriétaire, données traitées et criticité (faible, moyenne, élevée) justifiée selon la confidentialité, l’intégrité ou la disponibilité.","data":"","livrable":"Un tableau en texte de 10 actifs minimum, suivi de 3 lignes de synthèse sur les actifs les plus critiques.","crit":["Au moins 10 actifs distincts sont listés","Chaque actif a un propriétaire et des données associées","La criticité est justifiée par la confidentialité, l’intégrité ou la disponibilité","Les 3 actifs les plus critiques sont identifiés"],"corr":"Le serveur de dossiers patients et le NAS de sauvegarde sont normalement de criticité élevée (renseignements de santé, Loi 25). Une justification du type « c’est important » sans lien avec C, I ou D est insuffisante.","ref":"CIS Controls v8 (contrôles 1 et 2) ; NIST CSF 2.0 (ID.AM)"},{"n":2,"titre":"Évaluation de risques simplifiée","comp":"Analyse de risques","h":3,"ctx":"La direction de la clinique veut connaître ses cinq principaux risques de cybersécurité à partir de votre registre de la semaine 1.","mission":"Identifiez 5 risques en associant menace, vulnérabilité et actif. Estimez la probabilité (1 à 3) et l’impact (1 à 3), calculez le score (probabilité × impact) et proposez une mesure par risque.","data":"","livrable":"Une matrice de 5 risques classés du score le plus élevé au plus faible, chacun avec sa mesure recommandée.","crit":["Chaque risque relie une menace, une vulnérabilité et un actif","Les scores sont calculés correctement","Le classement est cohérent avec les scores","Chaque mesure est réaliste pour une petite clinique"],"corr":"Un risque bien formulé ressemble à : « Un rançongiciel (menace) exploite des postes non corrigés (vulnérabilité) et chiffre le serveur de dossiers (actif). » Vérifiez que score = probabilité × impact.","ref":"NIST CSF 2.0 (ID.RA) ; ISO/IEC 27005"},{"n":3,"titre":"Analyse de journaux d’authentification","comp":"Détection et analyse d’événements","h":3,"ctx":"Le serveur SSH de la clinique a produit l’extrait de journal ci-dessous. Votre gestionnaire vous demande si quelque chose d’anormal s’est produit.","mission":"Repérez les activités suspectes, justifiez-les avec des indices précis du journal, évaluez la gravité et listez les actions immédiates à prendre.","data":"03:12:01 sshd[881]: Failed password for admin from 203.0.113.45\n03:12:03 sshd[881]: Failed password for admin from 203.0.113.45\n03:12:05 sshd[881]: Failed password for root from 203.0.113.45\n03:12:07 sshd[881]: Failed password for root from 203.0.113.45\n03:12:09 sshd[881]: Failed password for test from 203.0.113.45\n03:12:12 sshd[881]: Failed password for jlavoie from 203.0.113.45\n03:12:15 sshd[881]: Accepted password for jlavoie from 203.0.113.45\n08:41:22 sshd[902]: Accepted password for mtremblay from 198.51.100.17\n09:05:10 sshd[915]: Failed password for mtremblay from 198.51.100.17\n09:05:19 sshd[915]: Accepted password for mtremblay from 198.51.100.17","livrable":"Un court rapport d’analyse : constat, indices relevés, gravité (avec justification) et actions immédiates.","crit":["L’adresse source suspecte est identifiée","Le type d’attaque (force brute) est nommé et justifié","La connexion réussie de jlavoie est signalée comme probable compromission","Les connexions de mtremblay sont jugées normales avec explication","Des actions immédiates sont proposées (réinitialisation, blocage, vérification)"],"corr":"203.0.113.45 essaie plusieurs comptes en 14 secondes puis réussit avec jlavoie : force brute suivie d’un compte probablement compromis (gravité élevée). mtremblay n’a qu’une seule faute de frappe, ce qui est normal.","ref":"NIST SP 800-61 Rev. 2 ; MITRE ATT&CK (T1110)"},{"n":4,"titre":"Analyse de courriels d’hameçonnage","comp":"Sensibilisation et détection","h":3,"ctx":"Trois employés vous transmettent des courriels qu’ils trouvent étranges. Vous devez les trier avant la fin de la journée.","mission":"Classez chaque courriel (légitime, suspect ou hameçonnage), listez les indices qui fondent votre décision, puis rédigez un message de sensibilisation de 5 lignes pour tous les employés.","data":"A. De : support@micr0soft-securite.com | Objet : Votre compte sera suspendu dans 24 h | Corps : Cliquez sur http://bit.ly/verif-compte pour confirmer votre mot de passe.\nB. De : paie@clinique-boreale.ca | Objet : Talon de paie de novembre | Pièce jointe : talon_paie.pdf | Message reçu chaque mois à la même date.\nC. De : direction@clinique-boreale.co | Objet : Urgent | Corps : Je suis en réunion. Achète 5 cartes-cadeaux de 100 $ et envoie-moi les codes. Ne me téléphone pas.","livrable":"Un tableau de classification avec indices pour A, B et C, et un message de sensibilisation de 5 lignes.","crit":["A est classé hameçonnage avec au moins deux indices (domaine imité, urgence, lien raccourci)","B est traité avec nuance (probablement légitime, vérification possible)","C est reconnu comme fraude au président (domaine .co, urgence, contournement)","Le message de sensibilisation est clair et donne des gestes concrets"],"corr":"A : domaine « micr0soft », urgence et lien raccourci. B : domaine correct et message attendu, mais on peut vérifier par un autre canal. C : domaine .co au lieu de .ca, demande inhabituelle de cartes-cadeaux et refus d’un appel de validation.","ref":"NIST CSF 2.0 (PR.AT) ; NIST SP 800-61 Rev. 2"},{"n":5,"titre":"Priorisation de vulnérabilités","comp":"Gestion des vulnérabilités","h":4,"ctx":"Un balayage de sécurité a produit la liste suivante. Le budget permet de corriger peu de choses à la fois : la direction attend vos priorités.","mission":"Classez chaque vulnérabilité (critique, élevée, moyenne, faible) avec une justification, puis proposez un plan de remédiation sur 30 jours (ordre, action, responsable).","data":"V1. Port RDP (3389) exposé à Internet sur le serveur de fichiers\nV2. Mot de passe administrateur du routeur laissé par défaut\nV3. Serveur de courriel : correctifs de sécurité en retard de 6 mois\nV4. TLS 1.0 activé sur le portail de rendez-vous\nV5. Sauvegardes du NAS jamais testées en restauration\nV6. Imprimante réseau avec interface web sans mot de passe","livrable":"Un classement des 6 vulnérabilités avec justification et un plan de 30 jours.","crit":["Les 6 vulnérabilités sont classées avec justification","V1 et V2 sont jugées critiques ou très prioritaires","V5 est reconnue comme essentielle à la reprise après incident","Le plan de 30 jours est ordonné et attribue des responsables"],"corr":"V1 et V2 sont directement exploitables depuis l’extérieur (critique). V3 et V5 sont élevées : sans sauvegarde testée, un rançongiciel devient très coûteux. V4 est moyenne, V6 faible à moyenne.","ref":"CIS Controls v8 (contrôles 4, 7 et 11) ; OWASP Top 10 (2021)"},{"n":6,"titre":"Rapport d’incident et bilan du parcours","comp":"Réponse aux incidents","h":4,"ctx":"Lundi 9 h : une employée signale que les fichiers du poste RECEPTION-02 portent l’extension .locked et qu’une note exige une rançon. Le poste est branché au réseau et au serveur de fichiers.","mission":"Rédigez le rapport d’incident en 4 phases : détection et analyse, confinement, éradication et reprise, leçons apprises. Ajoutez un bilan de 5 lignes sur les compétences développées pendant le parcours.","data":"","livrable":"Un rapport d’incident structuré en 4 phases et un bilan personnel de 5 lignes.","crit":["Le confinement est décrit en premier (isoler le poste du réseau)","La décision de ne pas payer la rançon est expliquée","La reprise passe par des sauvegardes vérifiées","L’obligation d’aviser la Commission d’accès à l’information en cas de risque de préjudice sérieux est mentionnée","Le bilan relie les 6 semaines à des compétences précises"],"corr":"Isoler le poste sans l’éteindre pour préserver les preuves, vérifier la propagation au serveur, restaurer depuis une sauvegarde saine. Avec des renseignements personnels, la Loi 25 impose d’aviser la Commission et les personnes visées si le préjudice est sérieux.","ref":"NIST SP 800-61 Rev. 2 ; Loi 25 (Québec)"}];
const MIN=60,DAY=864e5;
function newParcours(spec,start,mode){return{spec:spec,start:start,mode:mode,t:TASKS.map(function(t){return{n:t.n,s:'verrouillee',txt:'',chk:[],seen:null,done:null}})}}
function avail(p,i){return p.mode==='accelere'?p.start:p.start+i*7*DAY}
function refresh(p,now){var open=true;p.t.forEach(function(x,i){if(x.s==='completee')return;if(open){x.s=now>=avail(p,i)?'active':'verrouillee';open=false}else x.s='verrouillee'});return p}
function submit(p,n,txt,chk,now){var x=p.t.find(function(t){return t.n===n});if(!x)return'Tâche inconnue.';if(x.s!=='active')return'Cette tâche n’est pas active.';if((txt||'').trim().length<MIN)return'Le livrable doit contenir au moins '+MIN+' caractères.';x.s='completee';x.txt=txt.trim();x.chk=chk;x.done=now;refresh(p,now);return null}
function progress(p){return Math.round(100*p.t.filter(function(x){return x.s==='completee'}).length/p.t.length)}
function hours(p){return p.t.reduce(function(a,x,i){return a+(x.s==='completee'?TASKS[i].h:0)},0)}
function certReady(p){return p.t.every(function(x){return x.s==='completee'})}
function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
function b64(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){return decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))}
function makeCode(o){var b=b64(JSON.stringify(o));return'MS-'+b+'.'+fnv(b+'monstage-proto')}
function checkCode(c){try{var m=/^MS-([\w-]+)\.([0-9a-f]{8})$/.exec((c||'').trim());if(!m||fnv(m[1]+'monstage-proto')!==m[2])return null;return JSON.parse(unb64(m[1]))}catch(e){return null}}
function sus(a){if(a.length!==10||a.some(function(v){return!(v>=1&&v<=5)}))return null;return a.reduce(function(s,v,i){return s+(i%2===0?v-1:5-v)},0)*2.5}
/*END*/
var SUSQ=["Je pense que j’aimerais utiliser ce système fréquemment.","J’ai trouvé ce système inutilement complexe.","J’ai trouvé ce système facile à utiliser.","Je pense que j’aurais besoin de l’aide d’une personne technique pour utiliser ce système.","J’ai trouvé que les fonctions de ce système étaient bien intégrées.","J’ai trouvé qu’il y avait trop d’incohérence dans ce système.","Je pense que la plupart des gens apprendraient très vite à utiliser ce système.","J’ai trouvé ce système très lourd à utiliser.","Je me suis senti(e) très en confiance en utilisant ce système.","J’ai eu besoin d’apprendre beaucoup de choses avant de pouvoir utiliser ce système."];
var XQ=["Les consignes des tâches sont claires.","La charge de travail hebdomadaire me paraît réaliste.","Le portfolio généré me serait utile auprès d’un employeur.","Le certificat me paraît crédible."];
var KEY='monstage.v1',MEM={users:{},cur:null},$=function(s){return document.querySelector(s)};
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):MEM}catch(e){return MEM}}
function save(d){MEM=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fd(t){return new Date(t).toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'})}
async function hp(e,pw){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e+pw));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(_){return fnv(e+pw)}}
function me(){var d=load();return d.cur&&d.users[d.cur]?d.users[d.cur]:null}
function persist(u){var d=load();d.users[u.email]=u;save(d)}
function navBar(u,r){var l=[['tableau','Tableau de bord'],['portfolio','Portfolio et certificat'],['verifier','Vérifier un certificat'],['evaluation','Évaluer MonStage']];
 $('#nav').innerHTML='<b>Mon<i>Stage</i></b><small>Prototype MVP v0.3 · stages simulés TI</small>'+(u?l.map(function(x){return'<a href="#'+x[0]+'" class="'+(r===x[0]||(r.indexOf('tache')==0&&x[0]==='tableau')?'on':'')+'">'+x[1]+'</a>'}).join('')+'<span class="sp"></span><a href="#connexion" id="out">Déconnexion</a>':'<a href="#connexion" class="on">Connexion</a><a href="#verifier">Vérifier un certificat</a>')}
function vConnexion(){return'<h1>Bienvenue sur MonStage</h1><p class="mut">Des stages simulés en TI, 100 % en ligne et en français.</p><div class="card"><div class="tabs"><button class="alt" id="tl">Connexion</button><button class="alt" id="ti">Créer un compte</button></div><div id="f"></div></div><p class="note">Prototype de démonstration : vos données restent dans ce navigateur et ne sont envoyées nulle part.</p>'}
function formLogin(){$('#f').innerHTML='<label>Courriel<input id="e" type="email" autocomplete="username"></label><label>Mot de passe<input id="p" type="password" autocomplete="current-password"></label><div class="err" id="er" role="alert"></div><button id="go">Se connecter</button>';$('#go').onclick=async function(){var d=load(),e=$('#e').value.trim().toLowerCase(),u=d.users[e];if(!u||u.hash!==await hp(e,$('#p').value)){$('#er').textContent='Courriel ou mot de passe incorrect.';return}d.cur=e;save(d);location.hash='tableau'}}
function formInscr(){$('#f').innerHTML='<label>Nom complet<input id="n" autocomplete="name"></label><label>Courriel<input id="e" type="email" autocomplete="username"></label><label>Mot de passe (8 caractères minimum)<input id="p" type="password" autocomplete="new-password"></label><label>Programme<select id="g"><option>Baccalauréat en informatique</option><option>Certificat en informatique</option><option>Autre programme en TI</option></select></label><label><input type="checkbox" id="c">J’accepte que mes données de test soient conservées dans ce navigateur.</label><div class="err" id="er" role="alert"></div><button id="go">Créer mon compte</button>';$('#go').onclick=async function(){var n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),p=$('#p').value,d=load(),er=$('#er');if(n.length<2)return er.textContent='Entrez votre nom.';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return er.textContent='Courriel invalide.';if(p.length<8)return er.textContent='Mot de passe trop court (8 caractères minimum).';if(!$('#c').checked)return er.textContent='Veuillez accepter la conservation locale.';if(d.users[e])return er.textContent='Un compte existe déjà avec ce courriel.';d.users[e]={email:e,nom:n,prog:$('#g').value,hash:await hp(e,p),p:null,rep:null,cert:null};d.cur=e;save(d);location.hash='tableau'}}
function vTableau(u){var p=u.p,h='<h1>Bonjour, '+esc(u.nom.split(' ')[0])+'</h1>';
 if(!p){return h+'<p class="mut">Choisissez votre spécialité pour démarrer un stage simulé.</p><div class="card"><h2>Cybersécurité — Analyste junior (module 1, 6 semaines)</h2><p class="sm mut">Six mandats réalistes pour une clinique fictive : inventaire, risques, journaux, hameçonnage, vulnérabilités, incident.</p><label><input type="radio" name="m" value="normal" checked>Rythme hebdomadaire (une tâche par semaine)</label><label><input type="radio" name="m" value="accelere">Mode test accéléré (les 6 tâches s’enchaînent, pour les sessions d’essai)</label><br><button id="start">Démarrer le parcours</button></div><div class="card"><h2>Bientôt disponibles</h2><p class="sm mut">Développement logiciel · Support informatique · Finance et TI</p></div>'}
 refresh(p,Date.now());persist(u);var pc=progress(p);
 h+='<p class="mut">Parcours Cybersécurité · '+hours(p)+' h de pratique cumulées</p><div class="card"><div class="row"><span>Progression</span><div class="bar grow" role="progressbar" aria-valuenow="'+pc+'" aria-valuemin="0" aria-valuemax="100"><div style="width:'+pc+'%"></div></div><b>'+pc+' %</b></div></div><div class="card"><h2>Votre parcours</h2>';
 p.t.forEach(function(x,i){var T=TASKS[i],st={completee:'complétée',active:'à réaliser',verrouillee:'verrouillée'}[x.s],lock=x.s==='verrouillee'&&p.t[i-1]&&p.t[i-1].s==='completee'?' · dès le '+fd(avail(p,i)):'';
  h+='<div class="wk"><code>S0'+T.n+'</code><div class="grow">'+(x.s==='verrouillee'?'<span class="mut">'+esc(T.titre)+'</span>':'<a href="#tache-'+T.n+'">'+esc(T.titre)+'</a>')+'<div class="sm mut">'+T.h+' h estimées'+lock+'</div></div><span class="chip '+x.s+'">'+st+'</span></div>'});
 h+='</div>';if(certReady(p))h+='<div class="card"><h2>Parcours terminé</h2><a class="btn" href="#portfolio">Voir mon portfolio et mon certificat</a></div>';return h}
function vTache(u,n){var p=u.p,T=TASKS[n-1];if(!p||!T)return'<h1>Tâche introuvable</h1>';refresh(p,Date.now());var x=p.t[n-1];
 if(x.s==='verrouillee')return'<h1>Tâche verrouillée</h1><p class="mut">Cette tâche se débloque après la précédente'+(p.mode==='normal'?', au plus tôt le '+fd(avail(p,n-1)):'')+'.</p><a class="btn alt" href="#tableau">Retour</a>';
 if(x.s==='active'&&!x.seen){x.seen=Date.now();persist(u)}
 var h='<a href="#tableau" class="sm">← Tableau de bord</a><h1>Semaine '+n+' · '+esc(T.titre)+'</h1><p class="mut">Compétence : '+esc(T.comp)+' · '+T.h+' h estimées</p><div class="card"><h2>Contexte</h2><p>'+esc(T.ctx)+'</p><h2>Mission</h2><p>'+esc(T.mission)+'</p>'+(T.data?'<h2>Données fournies</h2><pre>'+esc(T.data)+'</pre>':'')+'<h2>Livrable attendu</h2><p>'+esc(T.livrable)+'</p></div>';
 if(x.s==='completee')return h+'<div class="card"><h2>Votre livrable</h2><pre>'+esc(x.txt)+'</pre><p class="sm mut">Soumis le '+fd(x.done)+'</p><h2>Pistes de correction</h2><p>'+esc(T.corr)+'</p><p class="sm mut">Référence : '+esc(T.ref)+'</p>'+(n<6?'<a class="btn" href="#tableau">Continuer</a>':'<a class="btn" href="#portfolio">Voir le portfolio</a>')+'</div>';
 return h+'<div class="card"><h2>Votre livrable</h2><textarea id="tx" rows="10" aria-label="Votre livrable" placeholder="Rédigez votre livrable ici…"></textarea><h2>Auto-évaluation</h2>'+T.crit.map(function(c,i){return'<label class="lk"><input type="checkbox" class="ck" data-i="'+i+'">'+esc(c)+'</label>'}).join('')+'<div class="err" id="er" role="alert"></div><button id="sub">Soumettre le livrable</button></div>'}
function vPortfolio(u){var p=u.p;if(!p)return'<h1>Portfolio</h1><p class="mut">Démarrez un parcours pour construire votre portfolio.</p>';var h='<h1>Portfolio</h1><p class="mut">'+hours(p)+' h de pratique · '+progress(p)+' % du parcours</p>';
 p.t.forEach(function(x,i){if(x.s==='completee')h+='<div class="card"><h2>S0'+x.n+' · '+esc(TASKS[i].titre)+'</h2><p class="sm mut">'+esc(TASKS[i].comp)+' · '+fd(x.done)+' · auto-évaluation '+x.chk.length+'/'+TASKS[i].crit.length+'</p><details><summary>Voir le livrable</summary><pre>'+esc(x.txt)+'</pre></details></div>'});
 if(!certReady(p))return h+'<div class="note">Le certificat est émis lorsque les 6 tâches sont complétées.</div>';
 if(!u.cert){return h+'<button id="mk">Générer mon certificat</button>'}
 var c=u.cert;return h+'<div class="cert"><p class="mut">Certificat numérique MonStage</p><h2>'+esc(u.nom)+'</h2><p>a réalisé le stage simulé <b>Cybersécurité — Analyste junior (module 1)</b><br>'+c.h+' h de pratique · émis le '+fd(c.d)+'</p><div class="code" id="cd">'+esc(c.code)+'</div></div><div class="row noprint" style="margin-top:12px"><button id="cp">Copier le code</button><button class="alt" onclick="print()">Imprimer</button></div><p class="sm mut">Un employeur peut vérifier ce code sous « Vérifier un certificat ».</p>'}
function vVerifier(){return'<h1>Vérifier un certificat</h1><p class="mut">Espace employeur : collez le code figurant sur le certificat.</p><div class="card"><label>Code de vérification<textarea id="vc" rows="3"></textarea></label><button id="vb">Vérifier</button><div id="vr" role="status" style="margin-top:12px"></div></div><p class="note">Limite du prototype : l’authenticité repose sur une somme de contrôle intégrée au code. La version complète interrogera la base de données de MonStage.</p>'}
function vEval(u){var d=u.rep;if(d&&d.sus!==undefined&&d.exp)return'<h1>Merci !</h1><div class="card"><p>Score SUS : <b>'+d.sus+' / 100</b>. Copiez le texte ci-dessous et transmettez-le à l’équipe MonStage (il ne contient ni votre nom ni votre courriel).</p><textarea id="ex" rows="9" readonly>'+esc(d.exp)+'</textarea><button id="cx">Copier</button></div>';
 var h='<h1>Évaluer MonStage</h1><p class="mut">Questionnaire d’utilisabilité (SUS) : 1 = pas du tout d’accord, 5 = tout à fait d’accord.</p><div class="card">';
 SUSQ.concat(XQ).forEach(function(q,i){h+='<fieldset style="border:0;padding:0;margin:0 0 14px"><legend class="sm">'+(i+1)+'. '+esc(q)+'</legend><div class="row">'+[1,2,3,4,5].map(function(v){return'<label><input type="radio" name="q'+i+'" value="'+v+'">'+v+'</label>'}).join('')+'</div></fieldset>'});
 return h+'<label>Ce qui m’a le plus bloqué(e) ou dérangé(e)<textarea id="c1" rows="3"></textarea></label><label>Ce que je changerais en premier<textarea id="c2" rows="3"></textarea></label><div class="err" id="er" role="alert"></div><button id="se">Envoyer mon évaluation</button></div>'}
function bind(u,r){
 if($('#tl')){$('#tl').onclick=formLogin;$('#ti').onclick=formInscr;formLogin()}
 if($('#start'))$('#start').onclick=function(){u.p=newParcours('cybersecurite',Date.now(),document.querySelector('input[name=m]:checked').value);refresh(u.p,Date.now());persist(u);render()};
 if($('#sub'))$('#sub').onclick=function(){var n=+r.split('-')[1],chk=[].map.call(document.querySelectorAll('.ck:checked'),function(c){return+c.dataset.i}),e=submit(u.p,n,$('#tx').value,chk,Date.now());if(e){$('#er').textContent=e;return}persist(u);render()};
 if($('#mk'))$('#mk').onclick=function(){var t=Date.now();u.cert={d:t,h:hours(u.p)};u.cert.code=makeCode({n:u.nom,p:'CYB-M1',d:new Date(t).toISOString().slice(0,10),h:u.cert.h});persist(u);render()};
 if($('#cp'))$('#cp').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(u.cert.code);$('#cp').textContent='Copié'};
 if($('#vb'))$('#vb').onclick=function(){var o=checkCode($('#vc').value);$('#vr').innerHTML=o?'<div class="chip completee">Certificat authentique</div><p><b>'+esc(o.n)+'</b> a complété le parcours <b>'+esc(o.p)+'</b> ('+esc(o.h)+' h) le '+esc(o.d)+'.</p>':'<div class="chip" style="background:#fbe3e0;color:#a32">Code invalide</div><p class="sm mut">Le code est incomplet ou a été modifié.</p>'};
 if($('#se'))$('#se').onclick=function(){var a=[];for(var i=0;i<14;i++){var c=document.querySelector('input[name=q'+i+']:checked');a.push(c?+c.value:0)}if(a.indexOf(0)>=0){$('#er').textContent='Veuillez répondre aux 14 énoncés.';return}
  var s=sus(a.slice(0,10)),p=u.p;u.rep={sus:s,exp:JSON.stringify({id:Math.random().toString(36).slice(2,8),sus:s,items:a,progression:p?progress(p):0,taches:p?p.t.map(function(x){return{n:x.n,vu:x.seen,fait:x.done,chk:x.chk.length}}):[],mode:p?p.mode:null,bloque:$('#c1').value,changer:$('#c2').value},null,1)};persist(u);render()};
 if($('#cx'))$('#cx').onclick=function(){$('#ex').select();document.execCommand('copy');$('#cx').textContent='Copié'};
 if($('#out'))$('#out').onclick=function(){var d=load();d.cur=null;save(d)}}
function render(){var r=(location.hash||'').slice(1)||'tableau',u=me();
 if(!u&&r!=='verifier')r='connexion';
 if(u&&r==='connexion')r='tableau';
 navBar(u,r);var h;
 if(r==='connexion')h=vConnexion();else if(r==='verifier')h=vVerifier();else if(r==='portfolio')h=vPortfolio(u);else if(r==='evaluation')h=vEval(u);else if(r.indexOf('tache-')==0)h=vTache(u,+r.split('-')[1]);else h=vTableau(u);
 $('#app').innerHTML=h;bind(u,r);window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
